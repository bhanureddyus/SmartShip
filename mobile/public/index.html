<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      HTML shell for `expo export --platform web`. With `web.output: "single"`
      (app.json) Expo CLI reads public/index.html as the template — app/+html.tsx
      only applies to `output: "static"`. This is Expo's built-in template plus
      the hosted-preview badge rule below; the lang and title placeholders are
      substituted by the CLI from app.json.
    -->
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Hosted-preview only: the hosting layer injects a fixed bottom-right
         "Created with Obvious" badge that overlaps the sticky action bar's primary
         CTA. Keep the attribution, make it icon-only, and float it above the bar.
         Same two selectors as public/app.css at the repo root. */
      a[href="https://obvious.ai/"] { bottom: calc(84px + env(safe-area-inset-bottom)) !important; right: 12px !important; padding: 6px !important; gap: 0 !important; border-radius: 999px !important; opacity: .45 !important; }
      a[href="https://obvious.ai/"] span { display: none !important; }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
